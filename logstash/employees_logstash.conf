input {
  tcp {
    port => 6000
    codec => json_lines
  }
}

filter {
  # Convierte hireDate (string) a un campo de fecha real, útil para graficar
  # contrataciones en el tiempo en Kibana. Se guarda en un campo aparte
  # para no perder el string original.
  date {
    match => ["hireDate", "yyyy-MM-dd HH:mm:ss.SSS"]
    target => "hireDateParsed"
  }

  mutate {
    remove_field => ["@version"]
  }
}

output {
  elasticsearch {
    hosts => ["http://127.0.0.1:9200"]
    index => "data_employees_mongo"
    document_id => "%{employeeID}"
  }

  # Para ver en consola lo que va llegando
  stdout {
    codec => json_lines
  }
}

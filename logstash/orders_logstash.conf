input {
  jdbc {
    # MySQL JDBC Connection String (northwind_mysql = tu base fuente)
    jdbc_connection_string => "jdbc:mysql://127.0.0.1:3306/northwind_mysql?useSSL=false&allowPublicKeyRetrieval=true"
    jdbc_user => "root"
    jdbc_password => "miclave"
    jdbc_driver_library => "./mysql-connector-j-8.4.0.jar"
    jdbc_driver_class => "com.mysql.cj.jdbc.Driver"

    # Solo trae filas con orderID mayor al último ya procesado (near real-time incremental)
    statement => "SELECT * FROM Orders WHERE orderID > :sql_last_value ORDER BY orderID ASC"
    use_column_value => true
    tracking_column => "orderid"
    tracking_column_type => "numeric"

    # Archivo donde Logstash guarda el último orderID procesado (evita choques con otros jdbc inputs)
    last_run_metadata_path => "./.logstash_jdbc_last_run_orders"

    # Revisa cada 10 segundos si hay pedidos nuevos
    schedule => "*/10 * * * * *"
  }
}

filter {
  mutate {
    remove_field => ["@version"]
  }
}

output {
  elasticsearch {
    hosts => ["http://127.0.0.1:9200"]
    index => "data_orders_mysql"
    document_id => "%{orderid}"
  }

  # Para ver en consola lo que va llegando mientras haces la demo
  stdout {
    codec => json_lines
  }
}
